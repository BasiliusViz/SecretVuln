[project]
name = "secretvuln-backend"
version = "0.1.0"
description = "Minimalistic vulnerability management platform (DefectDojo-like), SARIF-only import"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",          # sync driver for Alembic
    "pydantic[email]>=2.7",
    "pydantic-settings>=2.3",
    "redis>=5.0",
    "arq>=0.26",
    "casbin>=1.36",
    "casbin-sqlalchemy-adapter>=1.4",
    "ldap3>=2.9",
    "boto3>=1.34",
    "python-multipart>=0.0.9",
    "bcrypt>=4.1",
    "pyjwt>=2.8",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]
