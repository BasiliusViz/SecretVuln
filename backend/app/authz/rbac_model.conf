# Глобальный RBAC (без доменов — фаза 1).
# Субъект запроса — имя роли (роли пользователя вычисляются при логине из его групп).
# obj = ресурс, act = действие. Поддержка wildcard "*" в политике.
[request_definition]
r = sub, obj, act

[policy_definition]
p = sub, obj, act

[policy_effect]
e = some(where (p.eft == allow))

[matchers]
m = r.sub == p.sub && (p.obj == "*" || r.obj == p.obj) && (p.act == "*" || r.act == p.act)
